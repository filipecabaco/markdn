# Publishes docs/ (the markdn landing page) to GitHub Pages via the gh-pages
# branch:
#   https://filipecabaco.github.io/markdn/
#
# Branch-based publishing is used deliberately: the Actions-based deploy
# (actions/deploy-pages) needs the Pages site to already exist, and the
# workflow token is not allowed to create it on this repository
# ("Resource not accessible by integration").
#
# The site itself was enabled once, by hand, against this branch:
#   gh api -X POST repos/filipecabaco/markdn/pages \
#     -f 'source[branch]=gh-pages' -f 'source[path]=/'
# Pushing the branch alone does NOT provision the site; if Pages is ever
# turned off, that command has to be re-run.

name: pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Disable Jekyll processing
        run: touch docs/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
