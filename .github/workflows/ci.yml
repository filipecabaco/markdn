name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a branch; never cancel main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # OTP 28, pinned to the exact patch ampoule embeds: the sidecar is packed by
  # ampoule, whose runtime runs a release only from the OTP it was built with
  # (0.1.8 embeds ERTS 16.4.0.4, OTP 28.5.0.4). Keep in sync with release.yml
  # and mise.toml.
  OTP_VERSION: "28.5.0.4"
  ELIXIR_VERSION: "1.20.4"
  AMPOULE_VERSION: "0.1.8"

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (format · credo · dialyzer)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: setup-beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict

      - name: Restore deps cache
        uses: actions/cache@v6
        id: deps-cache
        with:
          path: deps
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-mix-

      - name: Restore _build cache
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-build-dev-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('lib/**/*.ex') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ env.OTP_VERSION }}-build-dev-${{ hashFiles('**/mix.lock') }}-
            ${{ runner.os }}-otp${{ env.OTP_VERSION }}-build-dev-

      # Keyed on the OTP/Elixir pair as well as the lock: a PLT built against a
      # different OTP is unusable, and reusing one silently reruns the whole build.
      - name: Restore PLT cache
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-plts-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plts-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      # priv/plts is gitignored, so it does not exist on a fresh checkout and the
      # cache restore is a no-op on the first run.
      - name: Run Dialyzer
        run: |
          mkdir -p priv/plts
          mix dialyzer --format github

  # ── 2. Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Elixir)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict

      - name: Restore deps cache
        uses: actions/cache@v6
        id: deps-cache
        with:
          path: deps
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-mix-

      - name: Restore _build cache
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-build-test-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('lib/**/*.ex', 'test/**/*.ex') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ env.OTP_VERSION }}-build-test-${{ hashFiles('**/mix.lock') }}-
            ${{ runner.os }}-otp${{ env.OTP_VERSION }}-build-test-

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

  # ── 3. Frontend ──────────────────────────────────────────────────────────────
  # The MDX pipeline is the part most likely to break silently, so this gate is
  # separate from the Elixir one and runs on every push.
  frontend:
    name: Frontend (typecheck · test · build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: "11"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: assets/pnpm-lock.yaml

      # --frozen-lockfile: a lockfile that does not match package.json is a bug
      # to surface here, not to paper over by silently resolving new versions.
      - name: Install
        working-directory: assets
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: assets
        run: pnpm check

      - name: Test
        working-directory: assets
        run: pnpm test

      - name: Build
        working-directory: assets
        run: pnpm build

  # ── 4. Shell scripts ─────────────────────────────────────────────────────────
  # The installer is the one artefact users run before anything of ours is on
  # their machine, so it is linted and actually executed here. `test-install.sh`
  # stubs curl and uname to run install.sh's real Linux path against a canned
  # release, and asserts a tampered payload is refused — a checksum check that
  # never rejects anything passes every happy-path test while protecting nobody.
  scripts:
    name: Shell (shellcheck · installer e2e)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The version is echoed because runners and developer machines do not ship
      # the same shellcheck, and the same finding changes code between releases
      # (SC2317 became SC2329 for functions in 0.11). Scripts here are kept clean
      # under 0.9 through 0.11 rather than pinning one version.
      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh install.sh
          shellcheck .github/scripts/*.sh

      - name: Installer end-to-end
        run: bash .github/scripts/test-install.sh

  # ── 5. Desktop build + smoke test ────────────────────────────────────────────
  # Compiling is not enough: the sidecar has to actually boot and serve from
  # inside an assembled release, which is where static-asset paths break. The
  # release copies priv/ in, and `:code.priv_dir` resolution differs from the
  # cwd-relative path that works in dev — a regression there yields a blank
  # window with no error, and only a booted smoke test catches it.
  #
  # The sidecar booted is the one that ships: packed by ampoule, as release.yml
  # packs it.
  desktop:
    name: Desktop build + smoke test
    runs-on: macos-14
    needs: [lint, test, frontend, scripts]
    env:
      MIX_ENV: prod

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6
        with:
          version: "11"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: assets/pnpm-lock.yaml

      - name: Restore deps cache
        uses: actions/cache@v6
        id: deps-cache
        with:
          path: deps
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-mix-

      - name: Restore _build cache
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-otp${{ env.OTP_VERSION }}-build-prod-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('lib/**/*.ex') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ env.OTP_VERSION }}-build-prod-${{ hashFiles('**/mix.lock') }}-
            ${{ runner.os }}-otp${{ env.OTP_VERSION }}-build-prod-

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Elixir deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: mix deps.get --only prod

      # The :desktop release runs `pnpm run build` itself via the build_assets
      # step in mix.exs; installing here just primes node_modules for it.
      - name: Frontend deps
        working-directory: assets
        run: pnpm install --frozen-lockfile

      - name: Install ampoule
        run: bash .github/scripts/install-ampoule.sh "$AMPOULE_VERSION"

      - name: Pack the sidecar with ampoule
        run: ampoule release --name desktop --target aarch64-darwin --out _build/prod/ampoule

      - name: Boot sidecar and smoke test
        run: bash .github/scripts/smoke-sidecar.sh

      # tauri.conf.json declares the sidecar as `externalBin: ../burrito_out/desktop`
      # (ex_tauri's path, whichever packer), and Tauri's build script refuses to
      # run when that resource is missing — so `cargo build` cannot even start
      # without it. The packed sidecar is staged where `mix ex_tauri.build` puts
      # it; release.yml builds and bundles the real thing.
      - name: Stage the sidecar where the Rust build looks for it
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p burrito_out
          cp _build/prod/ampoule/desktop-aarch64-darwin "burrito_out/desktop-${triple}"
          chmod +x "burrito_out/desktop-${triple}"
          ls -l burrito_out

      - name: Compile Tauri shell
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
