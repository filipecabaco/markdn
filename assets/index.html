<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>markdn</title>
    <!--
      The start-up indicator: the mark's tiles sliding together, in a loop. It
      lives here, outside the bundle, so it shows before any script runs; React
      replaces it when the app mounts. The theme follows the OS until the
      settings arrive and say otherwise.
    -->
    <script>
      if (matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <style>
      html {
        background: #fff;
        color: #18181b;
      }
      html.dark {
        background: #0a0a0a;
        color: #fafafa;
      }
      .markdn-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .markdn-boot svg {
        width: 56px;
        height: 56px;
      }
      .markdn-boot .fill-current {
        fill: currentColor;
      }
      .markdn-boot .fill-brand {
        fill: oklch(0.58 0.18 262);
      }
      html.dark .markdn-boot .fill-brand {
        fill: oklch(0.68 0.16 260);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="markdn-boot" role="status" aria-label="Starting markdn">
        <svg viewBox="-6 -6 72 72" class="markdn-mark" data-loading aria-hidden="true">
          <rect data-tile="0" x="0" y="0" width="60" height="17" rx="5" class="fill-current" />
          <rect data-tile="1" x="0" y="20" width="16" height="40" rx="5" class="fill-current" />
          <rect data-tile="2" x="22" y="20" width="16" height="40" rx="5" class="fill-brand" />
          <rect data-tile="3" x="44" y="20" width="16" height="40" rx="5" class="fill-current" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
