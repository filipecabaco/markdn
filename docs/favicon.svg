<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- MarkDN: four lines run in from the edges and meet at the interchange
       ring, on enamel. Colours are baked rather than tokenised: a favicon has
       no stylesheet. The dark tile holds its shape on a light or dark tab strip. -->
  <defs><clipPath id="t"><rect width="32" height="32" rx="7"/></clipPath></defs>
  <rect width="32" height="32" rx="7" fill="#0C1336"/>
  <g clip-path="url(#t)" fill="none" stroke-linecap="round" stroke-width="4">
    <path stroke="#DF2A2A" d="M-2 -2 L14.5 14.5"/>
    <path stroke="#3172F3" d="M34 -2 L14.5 14.5"/>
    <path stroke="#FBC024" d="M14.5 14.5 L34 14.5"/>
    <path stroke="#41AA4B" d="M14.5 14.5 L14.5 34"/>
  </g>
  <circle cx="14.5" cy="14.5" r="5" fill="#0C1336" stroke="#F4F3F0" stroke-width="3"/>
</svg>
