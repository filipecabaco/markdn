<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1230" />
    <title>MarkDN</title>
    <style>
      /* Shown on iPhone and iPad until the backend answers: the enamel shell with
         the mark, so the app opens into its own world rather than a white flash. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: oklch(0.205 0.068 271);
        color: oklch(0.8 0.025 268);
        font: 600 15px/1.3 "Barlow Condensed", "DIN Condensed", "Arial Narrow", sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 16px;
      }
      svg {
        width: 56px;
        height: 56px;
      }
      .line {
        stroke-width: 3;
        stroke-linecap: round;
      }
      .ring {
        fill: oklch(0.205 0.068 271);
        stroke: oklch(0.965 0.004 95);
        stroke-width: 2.5;
        transform-origin: 12px 12px;
        animation: arrive 1.4s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
      }
      @keyframes arrive {
        to {
          transform: scale(1.25);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path class="line" stroke="oklch(0.585 0.215 27)" d="M3 3l9 9" />
        <path class="line" stroke="oklch(0.585 0.205 262)" d="M21 3l-9 9" />
        <path class="line" stroke="oklch(0.84 0.165 85)" d="M12 12h9" />
        <path class="line" stroke="oklch(0.655 0.165 145)" d="M12 12v9" />
        <circle class="ring" cx="12" cy="12" r="4" />
      </svg>
      <p>Opening MarkDN</p>
    </main>
  </body>
</html>
