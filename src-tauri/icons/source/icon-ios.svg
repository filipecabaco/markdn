<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
  </defs>
  <!-- iOS masks the icon itself and rejects transparency, so the ground runs edge to edge. -->
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <g transform="translate(238 238) scale(9.133)">
    <rect x="0" y="0" width="60" height="17" rx="5" fill="#f4f4f5"/>
    <rect x="0" y="20" width="16" height="40" rx="5" fill="#f4f4f5"/>
    <rect x="22" y="20" width="16" height="40" rx="5" fill="#4f7df0"/>
    <rect x="44" y="20" width="16" height="40" rx="5" fill="#f4f4f5"/>
  </g>
</svg>
