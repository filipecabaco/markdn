<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: an 824px rounded square inside the 1024 canvas, as yaah's. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#ground)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- The mark (60×60 units, an "m" of four tiles) at 7.6px per unit, centred. -->
  <g transform="translate(284 284) scale(7.6)">
    <rect x="0" y="0" width="60" height="17" rx="5" fill="#f4f4f5"/>
    <rect x="0" y="20" width="16" height="40" rx="5" fill="#f4f4f5"/>
    <rect x="22" y="20" width="16" height="40" rx="5" fill="#4f7df0"/>
    <rect x="44" y="20" width="16" height="40" rx="5" fill="#f4f4f5"/>
  </g>
</svg>
