<!doctype html>
<!--
  What the window shows while the backend starts.

  Bundled into the app (tauri.conf.json `frontendDist`), so it is on screen the
  moment the window opens — before the BEAM has booted, and on a first launch
  before ampoule has started it. The shell navigates away to the backend's
  port once it answers; if it never does, the shell shows its own page saying why
  and where the log is.

  Self-contained on purpose: nothing it needs can come from the server it is
  waiting for, so it uses the system face rather than the bundled Geist. The same
  mark and animation as the iOS loading page (src-tauri/mobile): the tiles of the
  "m" sliding together, holding, and sliding on, in a loop.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>markdn</title>
    <style>
      html {
        background: #fff;
        color: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0a0a0a;
          color: #fafafa;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      .start {
        display: grid;
        justify-items: center;
        gap: 14px;
        max-width: 44ch;
        padding: 24px;
        text-align: center;
      }
      .status {
        margin: 0;
        color: #71717a;
      }
      .hint {
        margin: 0;
        color: #71717a;
        opacity: 0.85;
      }
      @media (prefers-color-scheme: dark) {
        .status,
        .hint {
          color: #a1a1aa;
        }
      }

      .mark {
        width: 56px;
        height: 56px;
      }
      .mark .tile {
        fill: currentColor;
      }
      .mark .brand {
        fill: oklch(0.58 0.18 262);
      }
      @media (prefers-color-scheme: dark) {
        .mark .brand {
          fill: oklch(0.68 0.16 260);
        }
      }
      .mark rect {
        transform-box: fill-box;
        transform-origin: center;
        animation: slide 2100ms cubic-bezier(0.16, 1, 0.3, 1) infinite both;
      }
      .mark rect[data-tile="0"] {
        --from: translateY(-90%);
      }
      .mark rect[data-tile="1"] {
        --from: translateY(-45%);
        animation-delay: 90ms;
      }
      .mark rect[data-tile="3"] {
        --from: translateY(-45%);
        animation-delay: 180ms;
      }
      /* The brand stem drops in last and completes the "m". */
      .mark rect[data-tile="2"] {
        --from: translateY(-70%);
        animation-delay: 300ms;
      }
      @keyframes slide {
        0% {
          transform: var(--from);
          opacity: 0;
        }
        24% {
          transform: none;
          opacity: 1;
        }
        68% {
          transform: none;
          opacity: 1;
        }
        86%,
        100% {
          transform: translateY(35%);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark rect {
          animation: breathe 1600ms ease-in-out infinite alternate;
          animation-delay: 0ms;
        }
        @keyframes breathe {
          from {
            opacity: 0.45;
          }
          to {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <!-- The native title bar is hidden, so the page is the window's handle. -->
  <body data-tauri-drag-region>
    <main class="start" data-tauri-drag-region>
      <svg class="mark" viewBox="-6 -6 72 72" aria-hidden="true" data-tauri-drag-region>
        <rect data-tile="0" class="tile" x="0" y="0" width="60" height="17" rx="5" />
        <rect data-tile="1" class="tile" x="0" y="20" width="16" height="40" rx="5" />
        <rect data-tile="2" class="brand" x="22" y="20" width="16" height="40" rx="5" />
        <rect data-tile="3" class="tile" x="44" y="20" width="16" height="40" rx="5" />
      </svg>
      <p class="status" role="status" data-tauri-drag-region>Opening markdn</p>
      <p class="hint" id="hint" hidden data-tauri-drag-region>
        The first launch unpacks the runtime and takes a few seconds. Later launches are
        quicker.
      </p>
    </main>

    <script>
      "use strict";

      // Only once the wait is long enough to wonder about: an ordinary launch is
      // gone before this would show, and a first one is explained.
      setTimeout(() => {
        document.getElementById("hint").hidden = false;
      }, 3500);
    </script>
  </body>
</html>
